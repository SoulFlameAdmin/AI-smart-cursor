name: Build DAVID Smart Cursor Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build/source_*.b64" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("DAVID_source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "DAVID_source.zip" -DestinationPath "src" -Force

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r src/requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name DAVID_Smart_Cursor `
            --paths src `
            --add-data "src/config.json;." `
            --add-data "src/lab;lab" `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            --collect-all supabase `
            --collect-all gotrue `
            --collect-all postgrest `
            --collect-all realtime `
            --collect-all storage3 `
            --collect-all supafunc `
            --collect-all pyautogui `
            src/main.py

      - name: Create final package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item "dist/DAVID_Smart_Cursor.exe" "package/DAVID_Smart_Cursor.exe"
          Copy-Item "src/README_BG.md" "package/README_BG.md"
          Copy-Item "DAVID_source.zip" "package/DAVID_Source_Code.zip"
          @"
          DAVID SMART CURSOR v0.1

          1. Стартирай DAVID_Smart_Cursor.exe.
          2. Windows може да покаже SmartScreen, защото файлът още не е подписан с платен code-signing сертификат.
          3. Влез със SoulFlame/Supabase акаунта си.
          4. Натисни Свържи и после СТАРТ.
          5. Започни с автономност Ниво 1 - Потвърждение.
          6. STOP спира DAVID. Преместване на мишката в горния ляв ъгъл активира PyAutoGUI failsafe.

          EXE е самостоятелен и не изисква инсталиран Python.
          "@ | Set-Content -Path "package/START_HERE.txt" -Encoding UTF8
          Compress-Archive -Path "package/*" -DestinationPath "DAVID_Smart_Cursor_Windows.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DAVID-Smart-Cursor-Windows
          path: DAVID_Smart_Cursor_Windows.zip
          if-no-files-found: error
          retention-days: 30
