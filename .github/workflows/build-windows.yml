name: Build DAVID Smart Cursor Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/build-windows.yml"
      - "BUILD_TRIGGER.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct DAVID Personal source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build/v011/source_*.b64" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 DAVID v0.1.1 source parts" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("DAVID_Personal_Source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "DAVID_Personal_Source.zip" -DestinationPath "src" -Force
          if (-not (Test-Path "src/DAVID_Smart_Cursor_v0_1_1/main.py")) { throw "DAVID source was not reconstructed" }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/DAVID_Smart_Cursor_v0_1_1/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r src/DAVID_Smart_Cursor_v0_1_1/requirements.txt
          python -m pip install pyinstaller

      - name: Compile source
        shell: pwsh
        run: |
          python -m compileall -q src/DAVID_Smart_Cursor_v0_1_1

      - name: Build Personal EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name DAVID_Smart_Cursor_Personal `
            --paths src/DAVID_Smart_Cursor_v0_1_1 `
            --add-data "src/DAVID_Smart_Cursor_v0_1_1/config.json;." `
            --add-data "src/DAVID_Smart_Cursor_v0_1_1/lab;lab" `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            --collect-all pyautogui `
            --collect-all pyperclip `
            src/DAVID_Smart_Cursor_v0_1_1/main.py

      - name: Create final Personal package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item "dist/DAVID_Smart_Cursor_Personal.exe" "package/DAVID_Smart_Cursor_Personal.exe"
          Copy-Item "src/DAVID_Smart_Cursor_v0_1_1/README_BG.md" "package/README_BG.md"
          Copy-Item "src/DAVID_Smart_Cursor_v0_1_1/START_HERE.txt" "package/START_HERE.txt"
          Copy-Item "DAVID_Personal_Source.zip" "package/DAVID_Personal_Source_Code.zip"
          $exeHash = (Get-FileHash "package/DAVID_Smart_Cursor_Personal.exe" -Algorithm SHA256).Hash.ToLower()
          $sourceHash = (Get-FileHash "package/DAVID_Personal_Source_Code.zip" -Algorithm SHA256).Hash.ToLower()
          @"
          DAVID_Smart_Cursor_Personal.exe  $exeHash
          DAVID_Personal_Source_Code.zip   $sourceHash
          "@ | Set-Content -Path "package/SHA256SUMS.txt" -Encoding UTF8
          Compress-Archive -Path "package/*" -DestinationPath "DAVID_Smart_Cursor_Personal_Supabase_Windows.zip" -Force

      - name: Upload Personal Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DAVID-Smart-Cursor-Personal-Supabase-v011
          path: DAVID_Smart_Cursor_Personal_Supabase_Windows.zip
          if-no-files-found: error
          retention-days: 30
