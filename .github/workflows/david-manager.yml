name: DAVID Manager V1

on:
  push:
    branches:
      - "feature/david-manager-**"
    paths:
      - "core/david-manager-v1.cjs"
      - "scripts/david-manager.cjs"
      - "tests/david-manager-v1.cjs"
      - "config/manager-projects.json"
      - ".github/workflows/david-manager.yml"
  pull_request:
    paths:
      - "core/david-manager-v1.cjs"
      - "scripts/david-manager.cjs"
      - "tests/david-manager-v1.cjs"
      - "config/manager-projects.json"
      - ".github/workflows/david-manager.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax validation
        run: |
          node --check core/david-manager-v1.cjs
          node --check scripts/david-manager.cjs
          node --check tests/david-manager-v1.cjs

      - name: DAVID Manager isolated tests
        run: node tests/david-manager-v1.cjs
